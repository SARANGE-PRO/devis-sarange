name: Index DGFiP des numéros de TVA

# Publie l'extraction DGFiP découpée par préfixe de SIREN sur Vercel Blob.
# Le jeton d'écriture provient du secret BLOB_READ_WRITE_TOKEN : il n'est ni
# affiché ni écrit dans le dépôt.

on:
  schedule:
    # MENSUEL, le 10 à 04h30 heure de Paris, fuseau explicite (sinon l'horaire
    # est interprété en UTC et dérive entre heure d'été et heure d'hiver).
    #
    # Pourquoi pas tous les jours : une publication écrit 892 fichiers de
    # préfixe + le manifeste, et chaque `put()` compte comme une « Advanced
    # Operation » Vercel Blob, dont le plan Hobby n'inclut que 2 000 par mois.
    # En quotidien le quota était épuisé en trois jours et Vercel bloquait le
    # magasin pendant trente jours — en lecture comme en écriture —, ce qui
    # faisait échouer le workflow tous les jours (constaté du 05/08 au 02/09
    # puis à partir du 06/09/2026). En mensuel : ~895 opérations, soit moins de
    # la moitié du quota, avec de la marge pour un déclenchement manuel.
    #
    # Le 10 plutôt que le 1er : après un blocage, le magasin ne redevient
    # accessible qu'une fois la fenêtre glissante de trente jours écoulée.
    - cron: '30 4 10 * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:

# Une seule publication à la fois : équivalent du verrou d'exécution.
concurrency:
  group: dgfip-vat-index
  cancel-in-progress: false

jobs:
  publish:
    name: Publier l'index sur Vercel Blob
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Publier l'index DGFiP
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DGFIP_BLOB_BASE_URL: ${{ vars.DGFIP_BLOB_BASE_URL }}
          # L'extraction complète (~4,8 millions d'entrées) est construite en
          # mémoire avant découpage.
          NODE_OPTIONS: --max-old-space-size=6144
        # Le script sort en code non nul si la publication échoue : l'exécution
        # est alors marquée en erreur, et la version précédente reste active.
        run: npm run publish-dgfip-vat-index
